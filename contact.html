<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact - My Portfolio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  
  <!-- Navigasi Atas Tengah (Sama dengan Home) -->
  <nav class="top-nav">
    <div class="nav-links">
      <a href="index.html">Home</a>
      <a href="portfolio.html">Portfolio</a>
      <a href="contact.html" class="active">Contact</a>
    </div>
    <button id="darkModeToggle">🌓</button>
  </nav>

  <main class="container">
    <section class="profile-section">
      <!-- Foto Tetap di Tengah -->
      <div class="avatar-wrapper">
        <img src="aku.jpg" alt="Profile Photo" class="avatar">
      </div>
      
      <div class="hero-text">
        <h1>Contact Me</h1>
        <p>Silahkan isi formulir di bawah untuk menghubungi saya.</p>
        
        <!-- Form Berada di Bawah Teks, Tetap di Tengah -->
        <form id="contactForm" style="margin-top: 30px; text-align: left;">
          <div style="margin-bottom: 15px;">
            <label style="display: block; margin-bottom: 5px;">Name:</label>
            <input type="text" id="name" required style="width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #ccc;">
          </div>
          
          <div style="margin-bottom: 15px;">
            <label style="display: block; margin-bottom: 5px;">Email:</label>
            <input type="email" id="email" required style="width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #ccc;">
          </div>
          
          <div style="margin-bottom: 20px;">
            <label style="display: block; margin-bottom: 5px;">Message:</label>
            <textarea id="message" required style="width: 100%; padding: 10px; border-radius: 5px; border: 1px solid #ccc; height: 100px;"></textarea>
          </div>
          
          <button type="submit" class="btn-primary" style="width: 100%;">Send Message</button>
          <p id="formMessage" style="margin-top: 10px; text-align: center;"></p>
        </form>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
